name: Build APKs
on:
  workflow_dispatch:
    inputs:
      patch_source:
        description: 'Select patch source'
        required: true
        default: 'morphe'
        type: choice
        options:
          - morphe
          - morphe-dev
          - piko
          - rushi
          - hoo-dles
          - hooman
          - paresh
          - de-vanced
          - tiktok
  workflow_call:
    inputs:
      patch_source:
        default: 'morphe'
        type: string
      filter_changelog:
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.set-matrix.outputs.prerelease }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1
          submodules: true

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          python-version: "3.13"
          enable-cache: true
          quiet: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Prepare version and rolling release
        id: version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER="latest"
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          gh release view "$VER" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create "$VER" --title "Syntrophe Patched Apps" --notes "Rolling unified release hub for all patched applications." --repo "$GITHUB_REPOSITORY" || true

      - name: Set matrix based on patch source
        id: set-matrix
        env:
          FILTER_CHANGELOG: ${{ inputs.filter_changelog }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RESULT="$(uv run python -m src.scripts.matrix get-matrix '${{ inputs.patch_source }}')"
          echo "matrix=$(echo "$RESULT" | jq -c '{include}')" >> "$GITHUB_OUTPUT"
          echo "prerelease=$(echo "$RESULT" | jq -r '.prerelease')" >> "$GITHUB_OUTPUT"

  run:
    needs: prepare
    if: needs.prepare.outputs.matrix != '{"include":[]}' && needs.prepare.outputs.matrix != '[]' && needs.prepare.outputs.matrix != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          submodules: true

      - name: Install java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961  # v5.7.0
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          python-version: "3.13"
          enable-cache: true
          quiet: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Start API Solver in background
        run: docker run -d -p 8000:8000 ghcr.io/sarperavci/cloudflarebypassforscraping:latest

      - name: Build APKs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
        run: uv run main.py ${{ matrix.id }} ${{ matrix.arch }}

      - name: Upload APKs to release
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.version }}
        run: |
          shopt -s nullglob
          apks=(./build/*.apk)
          if [[ ${#apks[@]} -eq 0 ]]; then
            echo "No APKs to upload, skipping"
            exit 0
          fi
          gh release upload "$TAG" "${apks[@]}" --clobber --repo "$GITHUB_REPOSITORY"

      - name: Upload build log to release
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.version }}
          LABEL: ${{ matrix.id }}${{ matrix.arch && format('-{0}', matrix.arch) || '' }}
        run: |
          [[ -f build.md ]] || exit 0
          [[ -s build.md ]] || exit 0
          cp build.md "build-${LABEL}.md"
          gh release upload "$TAG" "build-${LABEL}.md" --clobber --repo "$GITHUB_REPOSITORY"

  release:
    needs: [prepare, run]
    if: ${{ !cancelled() && needs.prepare.outputs.matrix != '{"include":[]}' && needs.prepare.outputs.matrix != '[]' && needs.prepare.outputs.matrix != '' }}

    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          submodules: true

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          python-version: "3.13"
          enable-cache: true
          quiet: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Check if any APKs were uploaded
        id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.version }}
        run: |
          has=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '[.assets[].name | select(endswith(".apk"))] | length > 0')
          echo "has_apks=${has}" >> "$GITHUB_OUTPUT"

      - name: Download logs from release
        if: steps.check.outputs.has_apks == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.version }}
        run: |
          mkdir -p logs
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "build-*.md" --dir logs || true
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[] | select(.name | startswith("build-")) | .apiUrl' | xargs -I{} gh api --method DELETE "{}" || true

      - name: Combine logs and finalize release
        if: steps.check.outputs.has_apks == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.version }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq '.body // ""' > existing_notes.md || true
          uv run python -m src.scripts.logs combine-logs logs existing_notes.md | sed "s/{TAG}/$TAG/g" > final.md
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "Syntrophe Patched Apps" --notes-file final.md

      - name: Send Telegram notification
        if: steps.check.outputs.has_apks == 'true' && env.TG_TOKEN != '' && env.TG_CHAT != ''
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
        run: uv run python -m src.scripts.telegram notify '${{ inputs.patch_source }}'